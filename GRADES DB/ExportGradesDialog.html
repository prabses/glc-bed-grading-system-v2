<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Export Student Grades</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100%;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        margin: auto;
        position: relative;
        overflow-y: auto;
        width: 100%;
        max-width: 500px;
        max-height: calc(100vh - 40px);
        box-sizing: border-box;
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      .header {
        text-align: center;
        margin-bottom: 25px;
      }

      .header h2 {
        color: #333;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      .header p {
        color: #666;
        font-size: 15px;
        margin: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #fafbfc;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-control:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: #f0f0f0;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .btn {
        flex: 1;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #f8f9fa;
        color: #6c757d;
        border: 2px solid #e9ecef;
      }

      .btn-secondary:hover {
        background: #e9ecef;
        color: #495057;
      }

      .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Export Student Grades</h2>
        <p>Export grades to CSV file</p>
      </div>

      <form id="exportGradesForm">
        <div class="form-group">
          <label class="form-label" for="academicYear">Academic Year</label>
          <select id="academicYear" class="form-control" required>
            <option value="">Select academic year...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="gradeLevel">Grade Level</label>
          <select id="gradeLevel" class="form-control" required disabled>
            <option value="">Select grade level...</option>
          </select>
          <span class="help-text">Select academic year first</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="section">Section</label>
          <select id="section" class="form-control" required disabled>
            <option value="">Select section...</option>
          </select>
          <span class="help-text">Select grade level first</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">Subject</label>
          <select id="subject" class="form-control" required disabled>
            <option value="">Select subject...</option>
          </select>
          <span class="help-text">Select section first</span>
        </div>

        <div class="button-group">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="google.script.host.close()"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="exportBtn" disabled>
            Export to CSV
          </button>
        </div>
      </form>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        google.script.run
          .withSuccessHandler(function(sheets) {
            const select = document.getElementById('academicYear');
            if (sheets && sheets.length > 0) {
              sheets.forEach(function(sheetName) {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                select.appendChild(option);
              });
            } else {
              const option = document.createElement('option');
              option.value = '';
              option.textContent = 'No academic year sheets found';
              option.disabled = true;
              select.appendChild(option);
            }
          })
          .withFailureHandler(function(error) {
            console.error('Error loading sheets:', error);
            alert('Error loading academic years: ' + error.toString());
          })
          .getStudentSheets();

        document.getElementById('academicYear').addEventListener('change', function() {
          const academicYear = this.value;
          const gradeLevelSelect = document.getElementById('gradeLevel');
          const sectionSelect = document.getElementById('section');
          const subjectSelect = document.getElementById('subject');
          const exportBtn = document.getElementById('exportBtn');
          
          gradeLevelSelect.innerHTML = '<option value="">Select grade level...</option>';
          gradeLevelSelect.disabled = true;
          sectionSelect.innerHTML = '<option value="">Select section...</option>';
          sectionSelect.disabled = true;
          subjectSelect.innerHTML = '<option value="">Select subject...</option>';
          subjectSelect.disabled = true;
          exportBtn.disabled = true;
          
          if (academicYear) {
            google.script.run
              .withSuccessHandler(function(gradeLevels) {
                if (gradeLevels && gradeLevels.length > 0) {
                  gradeLevels.forEach(function(level) {
                    const option = document.createElement('option');
                    option.value = level;
                    option.textContent = level;
                    gradeLevelSelect.appendChild(option);
                  });
                  gradeLevelSelect.disabled = false;
                } else {
                  const option = document.createElement('option');
                  option.value = '';
                  option.textContent = 'No grade levels found';
                  option.disabled = true;
                  gradeLevelSelect.appendChild(option);
                }
              })
              .withFailureHandler(function(error) {
                console.error('Error loading grade levels:', error);
                alert('Error loading grade levels: ' + error.toString());
              })
              .getGradeLevels(academicYear);
          }
        });

        document.getElementById('gradeLevel').addEventListener('change', function() {
          const academicYear = document.getElementById('academicYear').value;
          const gradeLevel = this.value;
          const sectionSelect = document.getElementById('section');
          const subjectSelect = document.getElementById('subject');
          const exportBtn = document.getElementById('exportBtn');
          
          sectionSelect.innerHTML = '<option value="">Select section...</option>';
          sectionSelect.disabled = true;
          subjectSelect.innerHTML = '<option value="">Select subject...</option>';
          subjectSelect.disabled = true;
          exportBtn.disabled = true;
          
          if (academicYear && gradeLevel) {
            google.script.run
              .withSuccessHandler(function(sections) {
                if (sections && sections.length > 0) {
                  sections.forEach(function(section) {
                    const option = document.createElement('option');
                    option.value = section;
                    option.textContent = section;
                    sectionSelect.appendChild(option);
                  });
                  sectionSelect.disabled = false;
                } else {
                  const option = document.createElement('option');
                  option.value = '';
                  option.textContent = 'No sections found';
                  option.disabled = true;
                  sectionSelect.appendChild(option);
                }
              })
              .withFailureHandler(function(error) {
                console.error('Error loading sections:', error);
                alert('Error loading sections: ' + error.toString());
              })
              .getSections(academicYear, gradeLevel);
          }
        });

        document.getElementById('section').addEventListener('change', function() {
          const academicYear = document.getElementById('academicYear').value;
          const gradeLevel = document.getElementById('gradeLevel').value;
          const section = this.value;
          const subjectSelect = document.getElementById('subject');
          const exportBtn = document.getElementById('exportBtn');
          
          subjectSelect.innerHTML = '<option value="">Select subject...</option>';
          subjectSelect.disabled = true;
          exportBtn.disabled = true;
          
          if (academicYear && gradeLevel && section) {
            google.script.run
              .withSuccessHandler(function(subjects) {
                if (subjects && subjects.length > 0) {
                  subjects.forEach(function(subject) {
                    const option = document.createElement('option');
                    option.value = subject;
                    option.textContent = subject;
                    subjectSelect.appendChild(option);
                  });
                  subjectSelect.disabled = false;
                } else {
                  const option = document.createElement('option');
                  option.value = '';
                  option.textContent = 'No subjects found';
                  option.disabled = true;
                  subjectSelect.appendChild(option);
                }
              })
              .withFailureHandler(function(error) {
                console.error('Error loading subjects:', error);
                alert('Error loading subjects: ' + error.toString());
              })
              .getSubjectsForExport(academicYear, gradeLevel, section);
          }
        });

        document.getElementById('subject').addEventListener('change', function() {
          const exportBtn = document.getElementById('exportBtn');
          exportBtn.disabled = !this.value;
        });

        document.getElementById('exportGradesForm').addEventListener('submit', function(e) {
          e.preventDefault();

          const academicYear = document.getElementById('academicYear').value;
          const gradeLevel = document.getElementById('gradeLevel').value;
          const section = document.getElementById('section').value;
          const subject = document.getElementById('subject').value;

          if (!academicYear || !gradeLevel || !section || !subject) {
            alert('Please fill in all fields.');
            return;
          }

          const exportBtn = document.getElementById('exportBtn');
          const originalText = exportBtn.textContent;
          exportBtn.textContent = 'Exporting...';
          exportBtn.disabled = true;

          google.script.run
            .withSuccessHandler(function(result) {
              if (result.success) {
                const csvContent = result.csvContent;
                const filename = result.filename;
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                alert('Success!\n\nExported ' + result.recordCount + ' record(s) to CSV file.');
                google.script.host.close();
              } else {
                alert('Export Failed!\n\n' + result.message);
                exportBtn.textContent = originalText;
                exportBtn.disabled = false;
              }
            })
            .withFailureHandler(function(error) {
              alert('Error: ' + error.toString());
              exportBtn.textContent = originalText;
              exportBtn.disabled = false;
            })
            .exportGrades(academicYear, gradeLevel, section, subject);
        });
      });
    </script>
  </body>
</html>
