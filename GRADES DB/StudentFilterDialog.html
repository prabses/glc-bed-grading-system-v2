<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Filter Student Data</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        margin: 0;
        position: relative;
        overflow: hidden;
        width: 100%;
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      .header {
        text-align: center;
        margin-bottom: 25px;
      }

      .header h2 {
        color: #333;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      .header p {
        color: #666;
        font-size: 15px;
        margin: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #fafbfc;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .btn {
        flex: 1;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: #f8f9fa;
        color: #6c757d;
        border: 2px solid #e9ecef;
      }

      .btn-secondary:hover {
        background: #e9ecef;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Filter Student Data</h2>
        <p>Filter students by criteria</p>
      </div>

      <form id="studentForm">
        <div class="form-group">
          <label class="form-label" for="studentNumber">Student Number</label>
          <input
            type="text"
            id="studentNumber"
            class="form-control"
            placeholder="Enter student number"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="gradeLevel">Grade Level</label>
          <select id="gradeLevel" class="form-control" required>
            <option value="">Select grade level...</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="section">Section</label>
          <input
            type="text"
            id="section"
            class="form-control"
            placeholder="Enter section"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="academicYear">Academic Year</label>
          <select id="academicYear" class="form-control" required>
            <option value="">Select academic year...</option>
          </select>
        </div>

        <div class="button-group">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="google.script.host.close()"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Apply Filter</button>
        </div>
      </form>
    </div>

    <script>
      // Populate academic year dropdown when page loads
      document.addEventListener('DOMContentLoaded', function() {
        google.script.run
          .withSuccessHandler(function(sheets) {
            const select = document.getElementById('academicYear');
            sheets.forEach(function(sheetName) {
              const option = document.createElement('option');
              option.value = sheetName;
              // Remove "A.Y." from display text, keeping only the year part
              const displayText = sheetName.replace(/A\.Y\.?\s*/gi, '').trim();
              option.textContent = displayText;
              select.appendChild(option);
            });
          })
          .withFailureHandler(function(error) {
            console.error('Error loading sheets:', error);
          })
          .getStudentSheets();
      });

      document
        .getElementById("studentForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const studentNumber = document.getElementById("studentNumber").value;
          const gradeLevel = document.getElementById("gradeLevel").value;
          const section = document.getElementById("section").value;
          const academicYear = document.getElementById("academicYear").value;

          if (!studentNumber) {
            alert("Please enter a student number.");
            return;
          }

          if (!gradeLevel) {
            alert("Please select a grade level.");
            return;
          }

          if (!section) {
            alert("Please enter a section.");
            return;
          }

          if (!academicYear) {
            alert("Please select an academic year.");
            return;
          }

          // Show placeholder message
          alert(
            "Filter functionality will be implemented soon!\n\n" +
            "Filtering by:\n" +
            "Student Number: " + studentNumber + "\n" +
            "Grade Level: " + gradeLevel + "\n" +
            "Section: " + section + "\n" +
            "Academic Year: " + academicYear
          );
          google.script.host.close();
        });
    </script>
  </body>
</html>
