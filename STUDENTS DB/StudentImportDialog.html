<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Import Student Data</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        margin: 0;
        position: relative;
        overflow: hidden;
        width: 100%;
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      .header {
        text-align: center;
        margin-bottom: 25px;
      }

      .header h2 {
        color: #333;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      .header p {
        color: #666;
        font-size: 15px;
        margin: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #fafbfc;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .file-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #fafbfc;
        transition: all 0.3s ease;
      }

      .file-input:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .btn {
        flex: 1;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: #f8f9fa;
        color: #6c757d;
        border: 2px solid #e9ecef;
      }

      .btn-secondary:hover {
        background: #e9ecef;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Import Student Data</h2>
         <p>Select academic year and upload CSV file</p>
      </div>

      <form id="importForm">
         <div class="form-group">
           <label class="form-label" for="academicYear">Academic Year</label>
           <select id="academicYear" class="form-control" required>
             <option value="">Select academic year...</option>
           </select>
         </div>

        <div class="form-group">
          <label class="form-label" for="csvFile">CSV File</label>
          <input
            type="file"
            id="csvFile"
            class="file-input"
            accept=".csv"
            required
          />
        </div>

        <div class="button-group">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="google.script.host.close()"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Import Data</button>
        </div>
      </form>
    </div>

     <script>
       // Populate academic year dropdown when page loads
       document.addEventListener('DOMContentLoaded', function() {
         google.script.run
           .withSuccessHandler(function(sheets) {
             const select = document.getElementById('academicYear');
            sheets.forEach(function(sheetName) {
              const option = document.createElement('option');
              option.value = sheetName;
              option.textContent = sheetName;
              select.appendChild(option);
            });
           })
           .withFailureHandler(function(error) {
             console.error('Error loading sheets:', error);
           })
           .getStudentSheets();
       });

       document
         .getElementById("importForm")
         .addEventListener("submit", function (e) {
           e.preventDefault();

           const academicYear = document.getElementById("academicYear").value;
          const fileInput = document.getElementById("csvFile");

          if (!academicYear) {
            alert("Please select an academic year.");
            return;
          }

          if (!fileInput.files[0]) {
            alert("Please select a CSV file.");
            return;
          }

          // Read the CSV file and import the data
          const file = fileInput.files[0];
          const reader = new FileReader();
          
          reader.onload = function(e) {
            const csvContent = e.target.result;
            
            // Show loading message
            const submitButton = document.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.textContent = 'Importing...';
            submitButton.disabled = true;
            
            // Call the import function
            google.script.run
              .withSuccessHandler(function(result) {
                if (result.success) {
                  alert('Success!\n\n' + result.message);
                  google.script.host.close();
                } else {
                  alert('Import Failed!\n\n' + result.message);
                  submitButton.textContent = originalText;
                  submitButton.disabled = false;
                }
              })
              .withFailureHandler(function(error) {
                alert('Error: ' + error.toString());
                submitButton.textContent = originalText;
                submitButton.disabled = false;
              })
              .importStudentData(csvContent, academicYear);
          };
          
          reader.onerror = function() {
            alert('Error reading the CSV file.');
          };
          
          reader.readAsText(file);
        });
     </script>
  </body>
</html>
