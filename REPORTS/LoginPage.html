<script>
  // If a session token survived a refresh, try to resume it instead of
  // making the user click through Google sign-in again.
  (() => {
    let token;
    try { token = localStorage.getItem('reportsSessionToken'); } catch (e) { token = null; }
    if (!token) return;

    google.script.run
      .withSuccessHandler((result) => {
        if (result && result.html) {
          // document.write() is the deprecated-for-parser-blocking API, but that
          // warning only applies to slow-network writes during initial parsing.
          // This runs after the page has already loaded, and write/open/close is
          // what reliably re-parses the swapped-in Form page's <script> tags.
          document.open();
          document.write(result.html);
          document.close();
        } else {
          try { localStorage.removeItem('reportsSessionToken'); } catch (e) {}
        }
      })
      .withFailureHandler(() => {
        try { localStorage.removeItem('reportsSessionToken'); } catch (e) {}
      })
      .resumeSession(token);
  })();
</script>
